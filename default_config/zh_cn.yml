# MirrorMcsmcdR 配置文件
# 第一个镜像条目是后续条目的基础配置。
# 添加另一个前缀，例如 "!!mirror2"，以配置另一个镜像服务器。

"!!mirror":
  # 镜像服目录，相对于本 MCDR。终端在此启动镜像服；is_mcdr 为 true 时，它是镜像服 MCDR 的目录（其 config.yml 所在目录）。
  root_path: ./Mirror
  # 镜像服是否由 MCDReforged 运行；普通服务端请设为 false。
  is_mcdr: true

  # MCSManager 连接设置。启用时，terminal 不被使用。
  mcsm:
    # 是否通过 MCSManager 控制镜像服务器。
    enable: false
    # MCSManager API 地址。
    url: http://127.0.0.1:23333/
    # MCSManager 服务器实例 UID。
    uuid:
    # MCSManager 远程节点 GID。
    remote_uuid:
    # MCSManager API 密钥。
    apikey:

  # 通过终端或子进程启动镜像服务器的设置。
  terminal:
    # MCSManager 禁用时，是否启用终端控制。
    enable: false
    # 用于启动镜像服务器的命令，在 root_path 下运行。
    launch_command: python -m mcdreforged
    # 镜像服务器端口，所有代理都必须填写。
    port:
    # 终端标题、screen 名称或子进程日志前缀。
    terminal_name: Mirror
    # 代理类型：linux、windows、subprocess 或 null 以自动选择。
    proxy_type:
    # 子进程控制台输出是否默认显示。
    console_log: false
    # 插件加载时，若记录中没有运行的进程，而 root_path 中恰好有一个不是插件启动的 MCDR，是否自动接管它；为 false 时只提示。
    auto_recover: true
    # is_mcdr 为 false 时，查找未跟踪服务端所认的 Java 进程名，正则表达式，不区分大小写。
    java_name: '^javaw?\d*(\.exe)?$'

  # 文件同步设置。
  sync:
    # 要同步的世界：gitignore 规则，与源服务器目录第一层的名字匹配，只选中目录（同 PrimeBackup 的 backup.targets），区分大小写。
    world:
      - world
    # 世界以外要同步的文件或目录，如 config/carpet.conf：gitignore 规则，路径相对于服务器目录，在任意层级匹配，世界内部的匹配不算。
    # 选中的目录像世界一样整体同步；选中的文件内容不同时覆盖；目标中独有的路径保持原样。不要选中 server.properties，否则镜像服的端口会被覆盖。
    extra_patterns: []
    # 源服务器目录；留空时使用本 MCDR 的 working_directory。
    source: ''
    # 一个或多个目标服务器目录；留空时使用 root_path 下镜像服 MCDR 的 working_directory（is_mcdr 为 false 时为 root_path 本身）。
    target: []
    # 是否忽略缺失的目标目录。
    ignore_inexistent_target_path: false
    # 同步工作线程数。
    concurrency: 4
    # 不同步、并在目标中删除的路径：gitignore 规则，路径相对于服务器目录（同 PrimeBackup 的 ignore_patterns）。
    ignore_patterns:
      - session.lock
    # 不同步、并保留目标中原有内容的路径，如 carpet.conf：gitignore 规则，路径相对于服务器目录（同 PrimeBackup 的 retain_patterns）。
    retain_patterns: []
    # 每次同步前，用 root_path 下镜像服自己的 PrimeBackup（>= 1.13.0）备份镜像服。is_mcdr 为 false 时不支持。
    # 启用后，备份不成功就不会复制任何文件。备份按镜像服 PrimeBackup 的现有设置进行。
    backup:
      # 每次同步前是否先备份；想不备份就同步，请改为 false 并重载配置。
      enable: false
      # 备份最多可用的秒数；超时的备份会被终止，同步被拒绝。
      timeout: 600
      # 镜像服 PrimeBackup 的设置与同步设置不一致、备份可能不完整时，是否必须确认后才同步。
      confirm_on_warning: true

  # 命令权限和命令行为。
  command:
    permission:
      # 所需权限等级，或 "console" 表示仅限控制台命令。
      status: 0
      start: 0
      stop: 2
      kill: 3
      sync: 2
      history: 0
      confirm: 0
      log: console
      input: console
      recover: 3
    action:
      status:
        require_confirm: false
      start:
        require_confirm: false
        # 启动最多需要的秒数; 在此期间状态显示为“正在启动”, 且无法重载配置文件。
        timeout: 120
      stop:
        require_confirm: true
        # 停止最多需要的秒数; 在此期间状态显示为“正在停止”。
        timeout: 60
      # 等待镜像服状态变化（例如同步前等待其停止、启动后等待其运行）时，两次完整检查之间的最长秒数；记录中的进程一退出或开始、停止监听端口就会立即检查。
      check_status_interval: 5
      kill:
        require_confirm: true
      sync:
        require_confirm: true
        ensure_server_closed: true
        auto_server_restart: false
        auto_mcdr_stop: false
        save_world:
          # 复制世界时禁用自动保存。
          turn_off_auto_save: true
          commands:
            save_all_worlds: save-all flush
            auto_save_off: save-off
            auto_save_on: save-on
          # 保存命令完成后匹配的服务器输出。
          saved_world_regex: '^Saved the game$'
          # 等待保存确认的最长时间。
          save_world_max_wait_sec: 60
      history:
        require_confirm: false
        max_history_count: 5
      confirm:
        timeout: 30
        cancel_anymsg: true

  # 显示设置。
  display:
    # 此镜像服务器在命令反馈中使用的名称。
    server_name: Mirror
    # 游戏内消息不显示的进程信息，控制台始终显示全部信息。可选 name（进程名）和 pid，例如 [name, pid]；两项都填时只显示进程数量。
    protected_process_info: []

# 对于额外的镜像服务器，你可以使用类 yaml 的语法来覆盖基础配置。例如：
# "!!mirror2":
#   mcsm.uuid: 12345678-1234-1234-1234-123456789012