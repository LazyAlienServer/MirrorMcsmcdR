# Configuration file for MirrorMcsmcdR
# The first mirror entry is the base configuration for later entries.
# Add another prefix such as "!!mirror2" to configure another mirror server.

"!!mirror":
  # MCSManager connection settings. When enabled, terminal is not used.
  mcsm:
    # Whether to control the mirror server through MCSManager.
    enable: false
    # MCSManager API address.
    url: http://127.0.0.1:23333/
    # MCSManager server instance UID.
    uuid:
    # MCSManager remote node GID.
    remote_uuid:
    # MCSManager API key.
    apikey:

  # Settings for starting the mirror server through a terminal or subprocess.
  terminal:
    # Whether terminal control is enabled when MCSManager is disabled.
    enable: false
    # Directory in which the mirror server start command runs.
    launch_path: ./Mirror
    # Command used to start the mirror server.
    launch_command: python -m mcdreforged
    # Mirror server port; required for every proxy.
    port:
    # Terminal title, screen name, or subprocess log prefix.
    terminal_name: Mirror
    # Whether the mirror server is itself started by MCDReforged.
    is_mcdr: true
    # Proxy type: linux, windows, subprocess, or null for automatic selection.
    proxy_type:
    # Whether subprocess console output is shown by default.
    console_log: false
    # Whether the plugin, when it loads with no running process in its record, adopts the one MCDR it finds running in the launch path; false only reports it.
    auto_recover: true

  # File synchronization settings.
  sync:
    # World directories to synchronize.
    world:
      - world
    # Source server directory.
    source: ./server
    # One or more target server directories.
    target:
      - ./Mirror/server
    # Whether missing target directories are ignored.
    ignore_inexistent_target_path: false
    # Number of synchronization workers.
    concurrency: 4
    # File names excluded from synchronization.
    ignore_files:
      - session.lock
    # Back up the mirror with the mirror's own PrimeBackup (>= 1.13.0) before every sync.
    # When enabled, nothing is copied unless the backup succeeded. The backup is made with the mirror's PrimeBackup settings as they are.
    backup:
      # Whether every sync is preceded by a backup; set to false and reload to sync without one.
      enable: false
      # Directory of the mirror's MCDR (where its config.yml is), relative to this MCDR. Empty uses terminal.launch_path while the terminal is enabled.
      mcdr_path: ''
      # Seconds a backup may take; a backup that takes longer is cancelled and the sync refused.
      timeout: 600
      # Whether a sync must be confirmed when the mirror's PrimeBackup settings differ from the sync settings, so that the backup may be incomplete.
      confirm_on_warning: true

  # Command permissions and command behavior.
  command:
    permission:
      # Required permission level, or "console" for console-only commands.
      status: 0
      start: 0
      stop: 2
      kill: 3
      sync: 2
      history: 0
      confirm: 0
      log: console
      input: console
      recover: 3
    action:
      status:
        require_confirm: false
      start:
        require_confirm: false
        # Seconds a start may take; meanwhile the status is "starting" and the config cannot be reloaded.
        timeout: 120
      stop:
        require_confirm: true
        # Seconds a stop may take; meanwhile the status is "stopping".
        timeout: 60
      # Longest gap in seconds between two full checks while waiting for the mirror's status to change (e.g. for it to stop before a sync, or to run after a start); a recorded process exiting, or starting or stopping to listen on the port, is checked at once.
      check_status_interval: 5
      kill:
        require_confirm: true
      sync:
        require_confirm: true
        ensure_server_closed: true
        auto_server_restart: false
        auto_mcdr_stop: false
        save_world:
          # Disable automatic saving while the world is copied.
          turn_off_auto_save: true
          commands:
            save_all_worlds: save-all flush
            auto_save_off: save-off
            auto_save_on: save-on
          # Server output matched after the save command completes.
          saved_world_regex: '^Saved the game$'
          # Maximum time to wait for the save confirmation.
          save_world_max_wait_sec: 60
      history:
        require_confirm: false
        max_history_count: 5
      confirm:
        timeout: 30
        cancel_anymsg: true

  # Display settings.
  display:
    # Name used in command feedback for this mirror server.
    server_name: Mirror
    # Process details left out of in-game messages; the console always shows everything. Options: name and pid, e.g. [name, pid]; with both, only counts are shown.
    protected_process_info: []

# For additional mirror servers, you can use yaml-like syntax to override the base configuration. e.g.
# "!!mirror2":
#   mcsm.uuid: 12345678-1234-1234-1234-123456789012