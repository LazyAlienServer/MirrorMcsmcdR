mirror_mcsmcdr: 

  page:
    page_outofindex: §4错误的页码范围
    nodata: §c暂无同步历史
    page: §7[ §f第 §b{current}§f/§b{total}§f 页 §7]
    left: "§8----- "
    right: " §8-----"
    pre: "§3<<"
    pre_prompt: 上一页
    next: "§3>>"
    next_prompt: 下一页
    end_prompt: 已经到头了

  multi_manager:
    init:
      error: "设置{prefix}时出错: {e}"
      success: "{prefix} §b构建成功"
      fail: "{prefix} §c构建失败"
      prefix_notfound: "§c{prefix} 配置文件缺失, 实例已禁用"

  manager: 
    load: "{prefix}已加载"
    reload:
      success: §a配置文件重载成功§7({prefix})
      fail: §c无效的配置文件§7({prefix})§c, 请查看控制台并处理报错
      fail.proxy: §c配置文件§7({prefix})§c的接口 §4{proxy} §c缺少有效值 §4'{keys}'
      fail.syncing: §c同步进行中, 无法重载配置文件§7({prefix})
      fail.starting: §b{server_name}§c正在启动, 无法重载配置文件§7({prefix})§c, 请等待启动完成或先执行{prefix} kill
    permission_denied: §b{server_name}§c操作权限不足
    console_only: §b{server_name}§c此命令仅可通过终端执行
    mcsm_disabled: §cMCSM-API未启用
    unavailable: §c配置文件错误, §4{prefix}§c实例已禁用
    backup:
      ready: "{prefix}: 同步前备份已就绪, PrimeBackup v{version} 位于 {path}"
      unavailable: "{prefix}: 同步前备份不可用, 修复之前所有同步都会被拒绝: {reason}"
  
  command:

    _execute:
      success: §b{server_name}§a{prompt}
      fail: §c操作失败 / §b{server_name}§f{prompt}
    
    help:
      info: §7----- §e{TITLE} §bv{VERSION} §7-----§f
      help: §7{prefix} help §f显示此帮助信息
      status: §7{prefix} status §f查看{server_name}状态
      start: §7{prefix} start §f启动{server_name}
      stop: §7{prefix} stop §f停止{server_name}
      kill: §7{prefix} kill [-f|--force] §f终止{server_name}
      sync: §7{prefix} sync §f同步{server_name}
      history: §7{prefix} history [page] §f查看同步历史
      reload: §7{prefix} reload §f重载{server_name}配置文件
      log: §7{prefix} log [count]|enable|disable §f控制subprocess代理日志输出
      execute: §7{prefix} execute <command> §f向subprocess代理发送指令

    proxy:
      title: "§e接口状态"
      enabled: "§a已启用"
      disabled: "§7未启用"
      error: "§c配置文件错误"

    confirm:
      prompt: §7{prefix} confirm §f以确认操作
      cancel: 操作§b{server_name}-{action}§c已取消
      previous: 先前操作§b{server_name}-{action}§c已取消
      timeout: 操作§b{server_name}-{action}§c超时已取消
      none: §c没有需要确认的任务
      others: §c你不能确认其他人的任务

    log:
      status: "{server_name}控制台日志输出: {status}"
      enabled: "§a已启用"
      set_enable: "{server_name}控制台日志输出§a已启用"
      enabled_count: "{server_name}控制台日志输出§a已启用§f，输出 §b{count} §f行后停止"
      disabled: "§c已禁用"
      set_disable: "{server_name}控制台日志输出§c已禁用"
      invalid_count: "§c输出行数必须是正整数"
      help: "§7用法: {prefix} log enable|disable|<count>"
      output_end: "§a输出 §b{count} §a行结束"
      reset_on_stop: "§7Subprocess 线程已停止"
    execute:
      sent: "§a命令已发送: §f{cmd}"
      failed: "§c命令发送失败"
      not_running: "§c镜像服未运行，无法发送命令"
      not_available: "§c此命令仅在使用 subprocess 代理时可用"
    state:
      unknown: 状态未知
      stopped: 已停止
      stopping: 正在停止
      starting: 正在启动
      running: 正在运行

    anomaly:
      orphan_screen: "§c已分离 (Java: 未启动; Screen: 已启动)"
      orphan_process: "§c已分离 (Java: 已启动; Screen: 未启动)"
      probe_conflict: "§c状态异常, RCON状态与端口状态不匹配"

    outcome:
      path_not_found: 未找到有效的启动目录, 请检查是否已创建正常的{server_name}服务端和插件配置文件是否配置正确
      force_required: Screen已不存在, 请使用{prefix} kill -f强制终止残留进程
      timeout: 进程未在限定时间内退出, 请使用{prefix} kill -f强制终止

    status:
      unsupported: 当前配置文件不支持status命令, 需要配置MCSM, terminal或RCON

    start:
      success: 启动指令已发送
      fail:
        unknown: 状态未知, 请报告管理员
        stopping: 正在停止, 请等待{server_name}停止后重新启动
        starting: 正在启动, 请稍等
        unsupported: 当前配置文件不支持start命令, 需要配置MCSM或terminal
        orphan_screen: Screen进程已启动但Java未启动, 请先使用kill指令终止Screen进程
        orphan_process: Java进程已启动但Screen未启动, 请先终止Java进程

    stop:
      success: 关闭指令已发送
      fail:
        unknown: 状态未知, 请报告管理员
        stopping: 正在停止, 请稍等
        starting: 正在启动, 请等待§b{server_name}§c启动后重新停止
        unsupported: 当前配置文件不支持stop命令, 需要配置MCSM, RCON或terminal
        orphan_screen: 不能停止, Screen已启动但未运行Java, 请尝试使用kill指令
        orphan_process: 不能停止, Java运行中但无Screen终端, 请先在控制台关闭正在运行的java进程

    kill:
      success: 强制终止...
      fail:
        unknown: 状态未知, 请报告管理员
        unsupported: 当前配置文件不支持kill命令, 需要配置MCSM或terminal

    sync:
      fail:
        task_exist: §b{server_name}§c已有正在进行中的同步任务
        unknown: §c操作失败 / §b{server_name}§c状态未知, 请报告管理员
        stopping: §c操作失败 / §b{server_name}§c正在停止, 请等待{server_name}停止后进行同步
        starting: §c操作失败 / §b{server_name}§c正在启动, 请等待{server_name}启动后重新停止并进行同步
        running: §c操作失败 / §b{server_name}§c正在运行, 请先停止{server_name}再进行同步
        probe_conflict: §c操作失败 / §b{server_name}§c状态异常, RCON状态与端口状态不匹配
        unsupported: §c操作失败 / §b{server_name}当前配置文件不支持获取运行状态, 需要配置MCSM, terminal或RCON
        orphan_screen: §c操作失败 / §b{server_name}§c Screen进程与Java进程已分离 (Java未启动)，请先终止Screen进程
        orphan_process: §c操作失败 / §b{server_name}§c Screen进程与Java进程已分离 (Screen未启动)，请先终止Java进程
      auto_restart:
        restarting: §b{server_name}§f未停止, 自动关闭{server_name}并进行同步...
