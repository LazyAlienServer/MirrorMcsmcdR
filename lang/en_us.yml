    legacy_json: "§econfig.json is deprecated; converted it to config.yml and kept the original as config.json.bak"
    unknown_key: "Config §b{prefix}§f: removed unknown key §7'{path}'§f (value: §7{value}§f)"
    backup: "Backed up the old config to §7{path}"
    unknown_removed: "§eRemoved §b{count} §eunknown config key(s), see the console"
  
  error.unknown: §cUnknown error, please check the console for details
