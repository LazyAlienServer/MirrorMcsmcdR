mirror_mcsmcdr: 

  page:
    page_outofindex: §4The page number does not exist!
    nodata: §cNo synchronization history
    page: §7[ §fPage §b{current}§f/§b{total}§7 ]
    left: "§8----- "
    right: " §8-----"
    pre: "§3<<"
    pre_prompt: Previous Page
    next: "§3>>"
    next_prompt: Next Page
    end_prompt: You've reached the end

  multi_manager:
    init:
      error: "An error occurred when configuring {prefix}: {e}"
      success: "{prefix} §bloaded successfully"
      fail: "{prefix} §cloaded unsuccessfully"
      prefix_notfound: "§cConfig file for {prefix} is missing, instance has been disabled"

  manager: 
    load: "{prefix} loaded"
    reload:
      success: §aConfig file reloaded successfully§7 ({prefix})
      fail: §cInvalid config file §7({prefix})§c, please check the console and address the error
      fail.proxy: §cInterface §7({prefix})§c config §4{proxy} §cmisses valid value(s) §4'{keys}'
      fail.syncing: §cCannot reload config §7({prefix})§c while a synchronization is in progress
      fail.starting: §cCannot reload config §7({prefix})§c while §b{server_name}§c is starting. Wait for it, or run {prefix} kill first
    permission_denied: §b{server_name}§c Permission denied
    console_only: §b{server_name}§c Console-only command
    mcsm_disabled: §cMCSM-API is disabled
    unavailable: §cConfig error, §4{prefix}§c instance disabled
    backup:
      ready: "{prefix}: pre-sync backup ready, PrimeBackup v{version} at {path}"
      unavailable: "{prefix}: pre-sync backup unavailable, every sync will be refused until this is fixed: {reason}"
  
  command:

    _execute:
      success: §b{server_name} §a{prompt}
      fail: §cOperation failed / §b{server_name} §f{prompt}
    
    help:
      info: "§7----- §e{TITLE} §bv{VERSION} §7-----§f"
      help: §7{prefix} help §fShow this help message
      status: §7{prefix} status §fCheck the status of {server_name}
      start: §7{prefix} start §fStart {server_name}
      stop: §7{prefix} stop §fStop {server_name}
      kill: §7{prefix} kill [-f|--force] §fKill {server_name}
      sync: §7{prefix} sync §fSynchronize {server_name}
      history: §7{prefix} history [page] §fView synchronization history
      reload: §7{prefix} reload §fReload config of {server_name}
      log: §7{prefix} log [count]|enable|disable §fControl subprocess proxy logs
      execute: §7{prefix} execute <command> §fSend a command through the subprocess proxy

    proxy:
      title: "§eInterface Status"
      enabled: "§aEnabled"
      disabled: "§7Disabled"
      error: "§cConfig error"

    confirm:
      prompt: §7{prefix} confirm §fto confirm operation
      cancel: Operation §b{server_name}-{action}§c cancelled
      previous: Previous operation §b{server_name}-{action}§c cancelled
      timeout: Operation §b{server_name}-{action}§c timed out
      none: §cNo tasks to confirm
      others: §cYou cannot confirm other people's task

    log:
      status: "{server_name} console log output: {status}"
      enabled: "§aEnabled"
      set_enable: "{server_name} console log output §aenabled"
      enabled_count: "{server_name} console log output §aenabled§f, stopping after §b{count} §flines"
      disabled: "§cDisabled"
      set_disable: "{server_name} console log output §cdisabled"
      invalid_count: "§cOutput count must be a positive integer"
      help: "§7Usage: {prefix} log enable|disable|<count>"
      output_end: "§aOutput of §b{count} §alines ended"
      reset_on_stop: "§7Subprocess thread stopped"
    execute:
      sent: "§aCommand sent: §f{cmd}"
      failed: "§cFailed to send command"
      not_running: "§cThe mirror server is not running; cannot send command"
      not_available: "§cThis command is only available with the subprocess proxy"
    state:
      unknown: status unknown
      stopped: stopped
      stopping: stopping
      starting: starting
      running: running

    anomaly:
      orphan_screen: "§cDetached (Java: not running; Screen: running)"
      orphan_process: "§cDetached (Java: running; Screen: not running)"

    outcome:
      path_not_found: Cannot find available launch path, please check if {server_name} server is created and plugins' config is configured correctly
      force_required: Screen is unavailable. Use {prefix} kill -f to forcefully terminate the remaining process
      timeout: The process did not exit in time. Use {prefix} kill -f to forcefully terminate it

    status:
      unsupported: Current config does not support status command. You need to configure MCSM or terminal

    start:
      success: starting command sent
      fail:
        unknown: status unknown, please report this problem to operators
        stopping: stopping, please restart after {server_name} stopped
        starting: starting, please wait for a moment
        unsupported: Current config does not support start command. You need to configure MCSM or terminal
        orphan_screen: "Screen process is running but Java is not, please use the kill command to terminate the Screen process"
        orphan_process: "Java process is running but Screen is not, please terminate the Java process first"

    stop:
      success: stopping command sent
      fail:
        unknown: status unknown, please report this problem to operators
        stopping: stopping, please wait for a moment
        starting: starting, please stop after §b{server_name}§c started
        unsupported: Current config does not support stop command. You need to configure MCSM or terminal
        orphan_screen: Cannot stop, Screen is running without Java; please try the kill command
        orphan_process: Cannot stop, Java is running without Screen; please close the Java process in the console first

    kill:
      success: forced termination in progress...
      fail:
        unknown: status unknown, please report this problem to operators
        unsupported: Current config does not support kill command. You need to configure MCSM or terminal

    sync:
      fail:
        task_exist: §b{server_name}§cOther tasks in progress
        unknown: §cOperation failed / §b{server_name}§c status unknown, please report this problem to operators
        stopping: §cOperation failed / §b{server_name}§c stopping, please sync after {server_name} stopped
        starting: §cOperation failed / §b{server_name}§c starting, please stop {server_name} first then sync
        running: §cOperation failed / §b{server_name}§c running, please stop {server_name} first then sync
        unsupported: §cOperation failed / §b{server_name}§c current config does not support detecting status. You need to configure MCSM or terminal
        orphan_screen: "§cOperation failed / §b{server_name}§c Screen and Java processes detached (Java not running). Please terminate the Screen process first"
        orphan_process: "§cOperation failed / §b{server_name}§c Screen and Java processes detached (Screen not running). Please terminate the Java process first"
      auto_restart:
        restarting: §b{server_name}§f running, auto-stopping {server_name} and syncing...
        fail: §cAuto-stopping failed, §b{server_name}§c§f{status}
      success: §b{server_name}§a is syncing...
      skip_dictionary: "Cannot find the following directories below §b{server_name}§c, so MirrorMcsmcdr skipped it: §f`§7{paths}§f`"
      completed: §aSynchronization completed!! §fTime taken | §b{time}s §7/ §f§b{changed_files_count}§f files updated
      identical: §aNo changes detected
      error: "§cAn error occurred while syncing, please check the console for details"
      backup:
        start: "§b{server_name}§f: backing up with its PrimeBackup..."
        done: "§aBackup §b#{backup_id}§a of §b{server_name}§a created"
        skipped: "§7{server_name} holds none of the synchronized worlds yet, nothing to back up"
        unavailable: "§cSync cancelled, no backup can be made: §f{reason}§c. See the console for details"
        failed: "§cSync cancelled, the backup failed: §f{reason}§c. See the console for details"
        stale: "§cSync cancelled before copying: §f{reason}§c. The backup is no longer current"
        warnings: "§e{count} setting(s) of §b{server_name}§e's PrimeBackup differ from the sync settings, so the backup may not hold everything the sync overwrites. See the console for details"
        detail: "Pre-sync backup of {server_name}: {detail}"
        output: "Last lines of the PrimeBackup output:\n{output}"
        reason:
          mcdr_path_required: "sync.backup.mcdr_path is required while the terminal is disabled"
          mcdr_path_not_found: "the mirror's MCDR directory does not exist"
          mcdr_config_unreadable: "cannot read the mirror's MCDR config"
          mcdr_config_invalid: "invalid value of '{option}' in the mirror's MCDR config"
          plugin_not_found: "no PrimeBackup plugin in the plugin directories of the mirror's MCDR"
          plugin_duplicated: "more than one PrimeBackup plugin in the mirror's MCDR"
          plugin_too_old: "the mirror's PrimeBackup has version {version}, at least 1.13.0 is required"
          pb_config_unreadable: "cannot read the mirror's PrimeBackup config"
          pb_config_invalid: "invalid value of '{option}' in the mirror's PrimeBackup config"
          database_not_found: "the mirror's PrimeBackup database does not exist"
          pathspec_missing: "the Python package pathspec, which PrimeBackup requires, is not installed"
          mirror_not_stopped: "{server_name} is {status}, not stopped"
          probe_failed: "the PrimeBackup command line tool exited with code {code}; are its Python dependencies installed?"
          launch: "cannot start the PrimeBackup command line tool"
          timeout: "PrimeBackup did not finish within {timeout} seconds"
          exit_code: "PrimeBackup exited with code {code}"
          no_backup_id: "PrimeBackup did not report a backup id"
          backup_id_mismatch: "PrimeBackup reported different backup ids: {ids}"
        warning:
          source_mismatch: "Pre-sync backup of {server_name}: its PrimeBackup backs up {source}, which is none of the sync targets ({targets}); what the sync overwrites is not backed up"
          targets_not_backed_up: "Pre-sync backup of {server_name}: these sync targets are not the directory its PrimeBackup backs up, they are overwritten without a backup: {targets}"
          worlds_not_targeted: "Pre-sync backup of {server_name}: backup.targets [{targets}] of its PrimeBackup does not include these synchronized worlds: {worlds}"
          ignored: "Pre-sync backup of {server_name}: its PrimeBackup ignores what the sync does not ignore (ignore_patterns / ignored_files): {patterns}"
          retained: "Pre-sync backup of {server_name}: retain_patterns of its PrimeBackup keeps these out of the backup: {patterns}"
          reuse_stat_unchanged_file: "Pre-sync backup of {server_name}: its PrimeBackup has reuse_stat_unchanged_file on; files with unchanged size and time are not read and may be stored with older content"
          creation_skip_missing_file: "Pre-sync backup of {server_name}: its PrimeBackup has creation_skip_missing_file on; files that disappear during the backup are skipped silently"
          storage_in_world: "Pre-sync backup of {server_name}: the PrimeBackup storage {storage} is inside the synchronized world {world}, the sync would delete the backup"
    
    history:
      record:
        success: "§e[{time}] §b{operator} §aSuccess §7| §fChanged files: §b{change_file_count} §fTime taken: §b{duration}s"
        identical: "§e[{time}] §b{operator} §aNo changes §7| §fTime taken: §b{duration}s"
        failed: "§e[{time}] §b{operator} §cFailed §7| §fException: §c{exception}"
        backup: " §7| §fBackup: §b#{backup_id}"
  
  mcsm:
    disabled: §cMCSM-API is disabled
    error:
      request: "§cMCSM request error, please report this problem to operators: §4{e}"
      "400": "[400] Bad Request, please visit GitHub to submit the issue ({error})"
      "403": "[403] Forbidden, please report this problem to operators ({error})"
      "500": "[500] Internal Server Error ({error})"
      "503": "[503] Server Unavailable"

  screen:
    error: "§cScreen error, please report this problem to operators: §4{e}"
  
  error.unknown: §cUnknown error, please check the console for details
