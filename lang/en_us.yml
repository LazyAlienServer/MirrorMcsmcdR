mirror_mcsmcdr: 

  page:
    page_outofindex: §4The page number does not exist!
    nodata: §cNo synchronization history
    page: §7[ §fPage §b{current}§f/§b{total}§7 ]
    left: "§8----- "
    right: " §8-----"
    pre: "§3<<"
    pre_prompt: Previous Page
    next: "§3>>"
    next_prompt: Next Page
    end_prompt: You've reached the end

  multi_manager:
    init:
      error: "An error occurred when configuring {prefix}: {e}"
      success: "{prefix} §bloaded successfully"
      fail: "{prefix} §cfailed to load"
      prefix_notfound: "§cConfig file for {prefix} is missing, instance has been disabled"

  manager: 
    load: "{prefix} loaded"
    reload:
      success: §aConfig file reloaded successfully§7 ({prefix})
      fail: §cInvalid config file §7({prefix})§c, please check the console and address the error
      fail.proxy: "§cConfig §7({prefix})§c: interface §4{proxy} §cis missing valid value(s) §4'{keys}'"
      fail.syncing: §cCannot reload config §7({prefix})§c while a synchronization is in progress
      fail.starting: §cCannot reload config §7({prefix})§c while §b{server_name}§c is starting. Wait for it, or run {prefix} kill first
    permission_denied: §b{server_name}§c Permission denied
    console_only: §b{server_name}§c Console-only command
    mcsm_disabled: §cMCSM-API is disabled
    unavailable: §cConfig error, §4{prefix}§c instance disabled
    backup:
      ready: "{prefix}: pre-sync backup ready, PrimeBackup v{version} at {path}"
      unavailable: "{prefix}: pre-sync backup unavailable, every sync will be refused until this is fixed: {reason}"
  
  command:

    _execute:
      success: §b{server_name} §a{prompt}
      fail: §cOperation failed / §b{server_name} §f{prompt}
    
    help:
      info: "§7----- §e{TITLE} §bv{VERSION} §7-----§f"
      help: §7{prefix} help §fShow this help message
      status: §7{prefix} status §fCheck the status of §b{server_name}§f
      start: §7{prefix} start §fStart §b{server_name}§f
      stop: §7{prefix} stop §fStop §b{server_name}§f
      kill: §7{prefix} kill [-f|--force] §fKill §b{server_name}§f
      sync: §7{prefix} sync §fSynchronize §b{server_name}§f
      history: §7{prefix} history [page] §fView synchronization history
      reload: §7{prefix} reload §fReload config of §b{server_name}§f
      log: §7{prefix} log [count]|enable|disable §fControl subprocess proxy logs
      input: §7{prefix} input <command> §fSend a command through the subprocess proxy

    proxy:
      title: "§eInterface Status"
      enabled: "§aEnabled"
      disabled: "§7Disabled"
      error: "§cConfig error"

    confirm:
      prompt: §7{prefix} confirm §fto confirm the operation
      prompts:
        start: §b{server_name}§f will start; §7{prefix} confirm §fto confirm
        stop: §b{server_name}§f will stop; §7{prefix} confirm §fto confirm
        kill: §b{server_name}§f will be killed; §7{prefix} confirm §fto confirm
        forcekill: §fThe processes of §b{server_name}§f listed above will be force-killed; §7{prefix} confirm §fto confirm
        sync: §b{server_name}§f will be synced; §7{prefix} confirm §fto confirm
      cancel: Operation §b{server_name}-{action}§c cancelled
      previous: Previous operation §b{server_name}-{action}§c cancelled
      timeout: Operation §b{server_name}-{action}§c timed out and was cancelled
      none: §cNo tasks to confirm
      others: §cYou cannot confirm other people's tasks

    log:
      status: "§b{server_name}§f console log output: {status}"
      enabled: "§aEnabled"
      set_enable: "§b{server_name}§f console log output §aenabled"
      enabled_count: "§b{server_name}§f console log output §aenabled§f, stopping after §b{count} §flines"
      disabled: "§cDisabled"
      set_disable: "§b{server_name}§f console log output §cdisabled"
      invalid_count: "§cOutput count must be a positive integer"
      help: "§7Usage: {prefix} log enable|disable|<count>"
      output_end: "§aFinished outputting §b{count} §alines"
      reset_on_stop: "§7Subprocess thread stopped"
      unavailable: "§cThis command is only available with the subprocess proxy"
    input:
      sent: "§aCommand sent: §f{cmd}"
      failed: "§cFailed to send command"
      not_running: "§b{server_name}§c is not running; cannot send command"
      unavailable: "§cThis command is only available with the subprocess proxy"
      unknown: "§cThe status of §b{server_name}§c is unknown; cannot send command. Check {prefix} status first"
    state:
      unknown: status unknown
      stopped: stopped
      stopping: stopping
      starting: starting
      running: running
      mcdr_only: server stopped, MCDR still running

    anomaly:
      orphan_screen: "§cDetached (Java: not running; Screen: running)"
      orphan_process: "§cConsole lost (processes still running)"
      mcdr_missing: "§cMCDR process not found"

    detail:
      line: "§7Detail: §f{detail}"
      panel: reported by MCSManager
      foreign_listener: "the port is held by processes not started by the plugin; {prefix} kill -f ends them"
      start_pending: "starting command sent; waiting for the server to open the port"
      port_closed: "the server process is running but the port is not open; if it stays so, check port in the config, or end it with {prefix} kill"
      stop_pending: "stopping command sent; waiting for the processes to exit"
      console_closing: the console is closing
      mcdr_only: "MCDR may be idle or exiting; {prefix} start starts the server in it, {prefix} stop makes MCDR exit, {prefix} kill ends it"
      orphan_screen: "the launch command has ended but the terminal is left; {prefix} kill closes it"
      orphan_process: "the plugin can no longer send commands to these processes; if they have not exited after a while, end them with {prefix} kill -f"
      mcdr_missing: "the server is running but MCDR has exited or cannot be recognized; {prefix} kill ends it"

    outcome:
      path_not_found: Cannot find a valid launch path; check that the §b{server_name}§f server exists and the plugin config is correct
      force_required: Screen no longer exists; if the remaining processes have not exited after a while, end them with {prefix} kill -f
      timeout: The process did not exit in time. Use {prefix} kill -f to forcefully terminate it
      no_target: There is no process to terminate
      unreadable_listener: The port is held by a process whose PID cannot be read (possibly of another user); nothing was terminated
      console_input_failed: Cannot send the command to the console of §b{server_name}§f; please try again later

    status:
      unsupported: The current config does not support the status command; configure MCSM or terminal
      mcdr: "§7MCDR: §f{process}"
      server: "§7Server: §f{process}"
      children: "§7Child processes: §f{processes}"
      others: "§7Other processes: §f{count}"
      port:
        listening: "§7Port {port}: §flistening"
        closed: "§7Port {port}: §fnot listening"
      foreign:
        title: "§7Port {port}: §cheld by the following §b{count} §cprocess(es) not started by the plugin:"
        count: "§7Port {port}: §cheld by §b{count} §cprocess(es) not started by the plugin"
      not_running: not running
      running: running
      count: "{count}"

    process:
      item: "§7- §f{process}"
      item_foreign: "§7- §f{process} §c(not started by the plugin)"
      unreadable: "a process that cannot be read"
      in_record: started by the plugin
      not_in_record: not started by the plugin
      console: "{prefix}: {name} (PID {pid}), {origin}, command line: {cmdline}"

    start:
      success: is starting
      ready: has started
      not_ready: "§cStart not completed / §b{server_name} §f{status}"
      fail:
        unsupported: The current config does not support the start command; configure MCSM or terminal
        syncing: syncing; please wait until the sync has finished
      hint:
        stopping: "§7Please start again after §b{server_name}§7 has stopped"

    stop:
      success: is stopping
      fail:
        unsupported: The current config does not support the stop command; configure MCSM or terminal
      hint:
        starting: "§7Please stop again after §b{server_name}§7 has started"

    kill:
      success: forced termination in progress...
      fail:
        unsupported: The current config does not support the kill command; configure MCSM or terminal
      targets:
        title: "§e{prefix} kill -f will forcefully terminate §b{count} §eprocess(es):"
        count: "§e{prefix} kill -f will forcefully terminate §b{count} §eprocess(es), §b{foreign} §eof them not started by the plugin"

    sync:
      fail:
        task_exist: §b{server_name} §calready has a sync in progress
        unsupported: "§cOperation failed / §b{server_name}§c: the current config does not support querying the status; configure MCSM or terminal"
      hint:
        running: "§7Please stop §b{server_name}§7 first, then sync"
        starting: "§7Please wait for §b{server_name}§7 to start, then stop it and sync"
      auto_restart:
        restarting: §b{server_name}§f is still running; stopping it automatically and syncing...
        exiting: §b{server_name}§f's MCDR is still running; stopping it automatically and syncing...
        fail: §cAuto-stop failed, §b{server_name} §f{status}
      success: §b{server_name}§a is syncing...
      skip_dictionary: "§cThese directories of §b{server_name}§c do not exist and were skipped: §f`§7{paths}§f`"
      completed: "§aSync completed! §fTime: §b{time}s §7/ §b{changed_files_count} §ffiles updated"
      identical: §aNo changes detected
      error: "§cAn error occurred while syncing, please check the console for details"
      backup:
        start: "§b{server_name}§f: backing up with its PrimeBackup..."
        done: "§aBackup §b#{backup_id}§a of §b{server_name}§a created"
        skipped: "§b{server_name}§7 holds none of the synchronized worlds yet, nothing to back up"
        unavailable: "§cSync cancelled, no backup can be made: §f{reason}§c. See the console for details"
        failed: "§cSync cancelled, the backup failed: §f{reason}§c. See the console for details"
        stale: "§cSync cancelled before copying: §f{reason}§c. The backup is no longer current"
        warnings: "§e{count} setting(s) of §b{server_name}§e's PrimeBackup differ from the sync settings, so the backup may not hold everything the sync overwrites. See the console for details"
        detail: "Pre-sync backup of §b{server_name}§f: {detail}"
        output: "Last lines of the PrimeBackup output:\n{output}"
        reason:
          mcdr_path_required: "sync.backup.mcdr_path is required while the terminal is disabled"
          mcdr_path_not_found: "the mirror's MCDR directory does not exist"
          mcdr_config_unreadable: "cannot read the mirror's MCDR config"
          mcdr_config_invalid: "invalid value of '{option}' in the mirror's MCDR config"
          plugin_not_found: "no PrimeBackup plugin in the plugin directories of the mirror's MCDR"
          plugin_duplicated: "more than one PrimeBackup plugin in the mirror's MCDR"
          plugin_too_old: "the mirror's PrimeBackup has version {version}, at least 1.13.0 is required"
          pb_config_unreadable: "cannot read the mirror's PrimeBackup config"
          pb_config_invalid: "invalid value of '{option}' in the mirror's PrimeBackup config"
          database_not_found: "the mirror's PrimeBackup database does not exist"
          pathspec_missing: "the Python package pathspec, which PrimeBackup requires, is not installed"
          mirror_not_stopped: "§b{server_name}§f is {status}, not stopped"
          probe_failed: "the PrimeBackup command line tool exited with code {code}; are its Python dependencies installed?"
          launch: "cannot start the PrimeBackup command line tool"
          timeout: "PrimeBackup did not finish within {timeout} seconds"
          exit_code: "PrimeBackup exited with code {code}"
          no_backup_id: "PrimeBackup did not report a backup id"
          backup_id_mismatch: "PrimeBackup reported different backup ids: {ids}"
        warning:
          source_mismatch: "Pre-sync backup of §b{server_name}§f: its PrimeBackup backs up {source}, which is none of the sync targets ({targets}); what the sync overwrites is not backed up"
          targets_not_backed_up: "Pre-sync backup of §b{server_name}§f: these sync targets are not the directory its PrimeBackup backs up, they are overwritten without a backup: {targets}"
          worlds_not_targeted: "Pre-sync backup of §b{server_name}§f: backup.targets [{targets}] of its PrimeBackup does not include these synchronized worlds: {worlds}"
          ignored: "Pre-sync backup of §b{server_name}§f: its PrimeBackup ignores what the sync does not ignore (ignore_patterns / ignored_files): {patterns}"
          retained: "Pre-sync backup of §b{server_name}§f: retain_patterns of its PrimeBackup keeps these out of the backup: {patterns}"
          reuse_stat_unchanged_file: "Pre-sync backup of §b{server_name}§f: its PrimeBackup has reuse_stat_unchanged_file on; files with unchanged size and time are not read and may be stored with older content"
          creation_skip_missing_file: "Pre-sync backup of §b{server_name}§f: its PrimeBackup has creation_skip_missing_file on; files that disappear during the backup are skipped silently"
          storage_in_world: "Pre-sync backup of §b{server_name}§f: the PrimeBackup storage {storage} is inside the synchronized world {world}, the sync would delete the backup"
    
    history:
      record:
        success: "§e[{time}] §b{operator} §aSuccess §7| §fChanged files: §b{change_file_count} §fTime taken: §b{duration}s"
        identical: "§e[{time}] §b{operator} §aNo changes §7| §fTime taken: §b{duration}s"
        failed: "§e[{time}] §b{operator} §cFailed §7| §fException: §c{exception}"
        backup: " §7| §fBackup: §b#{backup_id}"
  
  mcsm:
    disabled: §cMCSM-API is disabled
    error:
      request: "§cMCSM request error, please report this problem to operators: §4{e}"
      "400": "[400] Bad Request, please open an issue on GitHub ({error})"
      "403": "[403] Forbidden, please report this problem to operators ({error})"
      "500": "[500] Internal Server Error ({error})"
      "503": "[503] Server Unavailable"

  screen:
    error: "§cScreen error, please report this problem to operators: §4{e}"

  process_record:
    unreadable: "Cannot read the process record {path}; mirrors launched before are no longer tracked: {error}"
    unwritable: "Cannot write the process record {path}; after a plugin reload the running mirror will no longer be tracked: {error}"

  config_loader:
    merged: "Added the missing keys to the config file"
    created: "Config file missing; created config.yml with default values"
    legacy_json: "config.json is deprecated; converted it to config.yml and kept the original as config.json.bak"
    unknown_key: "Config §b{prefix}§f: removed unknown key §e{path}§f (value: §7{value}§f)"
    backup: "Backed up the old config to {path}"
    unknown_removed: "§eRemoved §b{count} §eunknown config key(s), see the console"
  
  error.unknown: §cUnknown error, please check the console for details
